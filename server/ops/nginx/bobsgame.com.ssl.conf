# Example nginx HTTPS site config for bobsgame.com static frontend on Hetzner.

server {
    listen 80;
    listen [::]:80;
    server_name bobsgame.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bobsgame.com;

    root /var/www/bobsgame.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/bobsgame.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bobsgame.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
