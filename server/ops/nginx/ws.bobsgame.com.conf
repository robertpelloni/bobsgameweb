# Example nginx site config for ws.bobsgame.com
#
# Place under /etc/nginx/sites-available/ws.bobsgame.com
# Then symlink into sites-enabled/ and reload nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ws.bobsgame.com;

    # Certbot / ACME challenge support can be added here if needed.

    location / {
        proxy_pass http://127.0.0.1:6065;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
