# Example nginx HTTP site config for bobsgame.com static frontend on Hetzner.
#
# Use this first so HTTP works and ACME challenges can complete before TLS.

server {
    listen 80;
    listen [::]:80;
    server_name bobsgame.com;

    root /srv/www/bobsgame.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
