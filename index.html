    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #game-container canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }

      /* Loading screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Mini YouTube player */
      #yt-mini {
        position: fixed;
        bottom: 40px;
        right: 8px;
        width: 260px;
        aspect-ratio: 16/9;
        z-index: 9998;
        border: 2px solid #ffd700;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        cursor: move;
        resize: both;
      }
      #yt-mini iframe {
        width: 100%;
        height: 100%;
        pointer-events: auto;
      }
      #yt-close {
        position: absolute;
        top: 2px;
        right: 6px;
        color: #ffd700;
        font-family: sans-serif;
        font-size: 18px;
        cursor: pointer;
        text-shadow:
          0 0 4px #000,
          0 0 4px #000;
        line-height: 1;
        z-index: 2;
      }
      #yt-close:hover {
        color: #fff;
      }

      /* Under Construction Banner - 90s style */
      #construction-banner {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 9999;
        text-align: center;
        font-family: "Comic Sans MS", "Chalkboard SE", cursive;
        animation: bannerBlink 1s step-end infinite;
        pointer-events: none;
      }
      #construction-banner .hazard-strip {
        background: repeating-linear-gradient(
          -45deg,
          #ffd700,
          #ffd700 10px,
          #000000 10px,
          #000000 20px
        );
        height: 8px;
      }
      #construction-banner .banner-content {
        background: #ffff00;
        color: #000000;
        padding: 6px 16px;
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: 3px outset #ffd700;
        display: inline-block;
        image-rendering: pixelated;
      }
      #construction-banner .banner-content .emoji {
        animation: workerWave 0.6s ease-in-out infinite alternate;
        display: inline-block;
      }
      #construction-banner .hazard-strip-bottom {
        background: repeating-linear-gradient(
          -45deg,
          #000000,
          #000000 10px,
          #ffd700 10px,
          #ffd700 20px
        );
        height: 8px;
      }
      @keyframes bannerBlink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.85;
        }
      }
      @keyframes workerWave {
        0% {
          transform: rotate(-10deg);
        }
        100% {
          transform: rotate(10deg);
        }
      }
    </style>
  </head>

    <script>
      // Close button
      document
        .getElementById("yt-close")
        .addEventListener("click", function (e) {
          e.stopPropagation();
          document.getElementById("yt-mini").remove();
        });

      // Draggable mini player
      (function () {
        var el = document.getElementById("yt-mini");
        if (!el) return;
        var dragging = false,
          ox,
          oy;
        el.addEventListener("mousedown", function (e) {
          if (e.target.tagName === "IFRAME") return;
          dragging = true;
          ox = e.clientX - el.offsetLeft;
          oy = e.clientY - el.offsetTop;
          e.preventDefault();
        });
        document.addEventListener("mousemove", function (e) {
          if (!dragging) return;
          el.style.left = e.clientX - ox + "px";
          el.style.top = e.clientY - oy + "px";
          el.style.right = "auto";
          el.style.bottom = "auto";
        });
        document.addEventListener("mouseup", function () {
          dragging = false;
        });
      })();
    </script>
