<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>bob's game</title>
    <link rel="icon" type="image/png" href="/bobsgame.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      #game-container canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      
      /* Loading screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      #loading h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    
/* Under Construction Banner - 90s style */
#construction-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 9999;
  text-align: center;
  font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
  animation: bannerBlink 1s step-end infinite;
  pointer-events: none;
}
#construction-banner .hazard-strip {
  background: repeating-linear-gradient(
    -45deg,
    #FFD700,
    #FFD700 10px,
    #000000 10px,
    #000000 20px
  );
  height: 8px;
}
#construction-banner .banner-content {
  background: #FFFF00;
  color: #000000;
  padding: 6px 16px;
  font-size: 14px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  border: 3px outset #FFD700;
  display: inline-block;
  image-rendering: pixelated;
}
#construction-banner .banner-content .emoji {
  animation: workerWave 0.6s ease-in-out infinite alternate;
  display: inline-block;
}
#construction-banner .hazard-strip-bottom {
  background: repeating-linear-gradient(
    -45deg,
    #000000,
    #000000 10px,
    #FFD700 10px,
    #FFD700 20px
  );
  height: 8px;
}
@keyframes bannerBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}
@keyframes workerWave {
  0% { transform: rotate(-10deg); }
  100% { transform: rotate(10deg); }
}
</style>
  </head>
  <body>
    <div id="loading">
      <h1>bob's game</h1>
      <div class="spinner"></div>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/renderer/index.ts"></script>
    <script>
      // Hide loading screen when game is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading')?.classList.add('hidden');
        }, 500);
      });
    </script>
  <!-- 90s Under Construction Banner -->
<div id="construction-banner">
  <div class="hazard-strip"></div>
  <div style="background:#FFD700;padding:2px 0;">
    <span class="banner-content">
      <span class="emoji">🚧</span> UNDER CONSTRUCTION <span class="emoji">👷</span>
    </span>
  </div>
  <div class="hazard-strip-bottom"></div>
</div>
</body>
</html>
