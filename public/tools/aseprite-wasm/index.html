<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Aseprite (WASM Wrapper)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            color: #eee;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aseprite WASM Environment</h1>
        <div class="loader"></div>
        <p>Awaiting Emscripten payload from build pipeline...</p>
    </div>
</body>
</html>
